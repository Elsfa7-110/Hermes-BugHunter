name: linux-skills-copy-smoke

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/install.sh"
      - "scripts/hunt.sh"
      - ".github/workflows/install-smoke.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/install.sh"
      - "scripts/hunt.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-copy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/hunt.sh
      - name: Copy skills into a temporary Hermes profile
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          HOME="$T" bash scripts/install.sh --dry-run
          HOME="$T" bash scripts/install.sh
          n="$(find "$T/.hermes/skills" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          echo "Copied skill folders: $n"
          [ "$n" -eq 98 ]
          HOME="$T" bash scripts/install.sh --help >/dev/null
          if HOME="$T" bash scripts/install.sh --unknown >/dev/null 2>&1; then
            echo "Unknown option should fail"; exit 1
          fi
          rm -rf "$T"

