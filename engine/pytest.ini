[pytest]
# The engine is a flat script directory: its modules import each other by bare
# name (`import scope`, `from engine import Engine` -> engine.py). That only
# resolves with THIS directory on sys.path, so it gets its own config: the
# repository-level pyproject.toml puts the repo root first, where `engine/`
# would shadow engine.py as a namespace package.
testpaths = .
addopts = -q
