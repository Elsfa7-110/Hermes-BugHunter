# Jekyll configuration for the documentation site.
title: DeepSeek BugHunter
description: Agent Skills for bug bounty research and authorized security assessments with Hermes Agent.
remote_theme: just-the-docs/just-the-docs
search_enabled: true
search:
  heading_level: 2
  previews: 3
color_scheme: dark
heading_anchors: true
exclude:
  - disclosed-reports/
  - verification/
  - automation/
  - "*.py"
  - ".DS_Store"
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
